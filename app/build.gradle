plugins {
    id 'com.android.application'
}

android {
    namespace 'com.samarei.pmoverlay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.samarei.pmoverlay'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    lint {
        // Sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk doesn't apply.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
